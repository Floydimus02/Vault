<!DOCTYPE html>
<html lang="en-GB">
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Vault demo: a private personal-finance app built on one Google Sheet. All figures here are made up.">
<title>Vault</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,300,0,0&display=block">
<style>
:root{--bg:#FFFFFF;--card:#F0F3F8;--well:#FFFFFF;--ink:#050A1A;--mute:#56637D;--line:#DCE2EB;--soft:#C9D1DD;--acc:#C4005A;--acc2:#E0127A;--pos:#0B7A5C;--posbg:#DDF4EC;--neg:#C42020;--negbg:#FDE4E4;--amber:#8A5800;--amberbg:#FCEFC7;--blue:#1F5BD8;--bluebg:#E3EEFF;--chip:#F0F3F8;--proj:#E4E8EF;--projb:#B8C0CC;--scrim:rgba(5,10,26,.45);--shadow:0 8px 24px rgba(5,10,26,.08)}
html.dark{--bg:#0A0A0C;--card:#17171B;--well:#232329;--ink:#F5F6F8;--mute:#9AA3B2;--line:#2B2B32;--soft:#3A3A44;--acc:#E0007A;--acc2:#F0359A;--pos:#4FD1A5;--posbg:#10302A;--neg:#FF8A80;--negbg:#3A1717;--amber:#F2B53A;--amberbg:#3A2C0E;--blue:#8AB4FF;--bluebg:#162545;--chip:#1F1F24;--proj:#1F1F24;--projb:#45454F;--scrim:rgba(0,0,0,.6);--shadow:0 8px 24px rgba(0,0,0,.4)}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:Inter,'Helvetica Neue',Helvetica,Arial,sans-serif;-webkit-text-size-adjust:100%;-webkit-font-smoothing:antialiased}
body{display:flex;justify-content:center}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit}
.ms{font-family:'Material Symbols Outlined';font-weight:300;font-style:normal;font-size:22px;line-height:1;display:inline-block;white-space:nowrap;font-feature-settings:'liga';font-variation-settings:'wght' 300;-webkit-font-smoothing:antialiased}
.app{width:100%;max-width:480px;height:100dvh;position:relative;overflow:hidden;display:flex;flex-direction:column;background:var(--bg)}
@media (min-width:600px){.app{border-left:1px solid var(--line);border-right:1px solid var(--line)}}
header.top{display:flex;align-items:center;justify-content:space-between;padding:12px 8px 10px 16px;flex:none;border-bottom:1px solid var(--line)}
header.top.back{padding-left:6px}
.hl{display:flex;align-items:center;gap:10px;min-width:0}
.logo{width:40px;height:40px;border-radius:10px;background:linear-gradient(145deg,var(--acc2),var(--acc));color:#FFF;font-weight:800;font-size:21px;line-height:40px;text-align:center;flex:none;box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.35)}
h1{margin:0;font-size:22px;font-weight:800;line-height:1.2;letter-spacing:-.5px}
.hsub{font-size:13px;color:var(--mute)}
main > *{flex:none}
main{flex:1;overflow-y:auto;padding:14px 14px 28px;display:flex;flex-direction:column;gap:12px;-webkit-overflow-scrolling:touch}
.card{--chip:var(--well);background:var(--card);border:0;border-radius:14px;padding:18px 18px 16px}
.ttl{font-size:15px;font-weight:500;color:var(--mute);margin:0;display:flex;align-items:center;gap:8px}
.ttl .ms{font-size:20px;color:var(--mute)}
.card > .ttl:first-child,.card > div:first-child:has(> .ttl){padding-bottom:12px;margin-bottom:14px !important;border-bottom:1px solid var(--line)}
.lead{font-size:13px;color:var(--mute);margin:-6px 0 12px}
.sh{font-size:12px;font-weight:600;letter-spacing:.4px;text-transform:uppercase;color:var(--mute);margin:0}
.th{font-size:11px;font-weight:600;letter-spacing:.4px;text-transform:uppercase;color:var(--mute)}
.note{font-size:13px;color:var(--mute);margin:10px 0 0;line-height:1.45}
.small{font-size:12px;color:var(--mute)}
.num{font-variant-numeric:tabular-nums;white-space:nowrap}
.pos{color:var(--pos)}.neg{color:var(--neg)}.amb{color:var(--amber)}.mute{color:var(--mute)}
.ib{width:44px;height:44px;display:inline-flex;align-items:center;justify-content:center;border:0;border-radius:12px;background:transparent;color:var(--ink);cursor:pointer;padding:0;flex:none}
.ib .ms{font-size:24px}
.ib:hover{background:var(--chip)}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.stat{display:flex;flex-direction:column;gap:2px;min-width:0}
.stat .l{font-size:12px;color:var(--mute)}
.stat .n{font-size:19px;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:-.2px}
.stat .s{font-size:12px;color:var(--mute)}
.big{font-weight:800;letter-spacing:-1px;font-variant-numeric:tabular-nums;white-space:nowrap}
.dp{display:inline-flex;align-items:center;gap:4px;border-radius:8px;padding:6px 12px;font-size:13px;font-weight:700;white-space:nowrap}
.dp.up{background:var(--posbg);color:var(--pos)}.dp.dn{background:var(--negbg);color:var(--neg)}
.dp i{font-style:normal;font-weight:500;color:inherit;opacity:.75}
.pill{display:inline-flex;align-items:center;gap:4px;border-radius:6px;padding:4px 11px;font-size:12px;font-weight:700;white-space:nowrap}
.pill.g{background:var(--posbg);color:var(--pos)}.pill.a{background:var(--amberbg);color:var(--amber)}.pill.r{background:var(--negbg);color:var(--neg)}.pill.m{background:var(--bluebg);color:var(--blue)}
.chip{font-size:12px;font-weight:700;padding:5px 10px;border-radius:6px;background:var(--bluebg);color:var(--blue)}
.row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);font-size:15px}
.row:last-child{border-bottom:0}
.rowbtn{display:flex;justify-content:space-between;align-items:center;gap:12px;width:100%;min-height:52px;padding:10px 0;border:0;border-bottom:1px solid var(--line);background:transparent;font-size:15px;text-align:left;cursor:pointer}
.rowbtn:last-child{border-bottom:0}
.rl{display:flex;flex-direction:column;gap:2px;min-width:0}
.rl .sub{font-size:13px;color:var(--mute)}
.rr{display:flex;align-items:center;gap:8px;flex:none}
.chev{font-size:20px;color:var(--mute)}
.grid3{display:grid;grid-template-columns:minmax(0,1fr) auto 96px;gap:10px;align-items:center}
.grid3 .th{white-space:nowrap}
.kvg{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.kv{display:flex;flex-direction:column;gap:3px;min-width:0}
.kv span:first-child{font-size:12px;color:var(--mute)}
.kv span:nth-child(2){font-size:15px;font-weight:700}
.trk{position:relative;display:block;height:6px;background:var(--chip);border-radius:999px}
.fil{position:absolute;left:0;top:0;bottom:0;border-radius:999px;background:var(--acc)}
.fil.over{background:var(--neg)}
.tick{position:absolute;top:-3px;width:2px;height:12px;border-radius:1px;background:var(--ink)}
.bars{display:grid;gap:4px;align-items:end}
.bars div{border-radius:4px 4px 0 0}
.blab{display:grid;gap:4px;font-size:10px;color:var(--mute);text-align:center;padding-top:4px}
.legend{font-size:12px;color:var(--mute);margin-top:8px;display:flex;gap:14px;flex-wrap:wrap}
.sw{display:inline-block;width:10px;height:10px;border-radius:3px;vertical-align:-1px;margin-right:4px}
.box{margin-top:12px;padding:12px 14px;border-radius:12px;font-size:14px;font-weight:600;line-height:1.4}
.box.a{background:var(--amberbg);color:var(--amber)}.box.r{background:var(--negbg);color:var(--neg)}
.box.g{background:var(--posbg);color:var(--pos)}.box.b{background:var(--selbg);color:var(--selfg)}
.box a{color:inherit;text-decoration:underline}
.seg{display:flex;gap:4px;padding:4px;border-radius:12px;background:var(--chip)}
.seg button{flex:1;min-height:40px;padding:0 6px;border:0;border-radius:9px;background:transparent;color:var(--mute);font-size:14px;font-weight:600;cursor:pointer;line-height:1.15;white-space:nowrap}
.seg button.on{background:var(--ink);color:var(--bg);font-weight:700}
.sel{font:inherit;font-size:14px;font-weight:600;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:8px 12px;min-height:40px}
.mchips{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px}
.mchips button{flex:none;min-width:54px;min-height:40px;padding:0 14px;border:1px solid var(--line);border-radius:10px;background:var(--bg);font-size:14px;font-weight:600;cursor:pointer}
.mchips button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.hd{font-size:17px;font-weight:700;margin:0;display:flex;align-items:center;gap:10px}
.step{font-size:12px;font-weight:800;width:24px;height:24px;border-radius:7px;background:linear-gradient(145deg,var(--acc2),var(--acc));color:#FFF;display:inline-flex;align-items:center;justify-content:center}
.w{display:flex;justify-content:space-between;gap:12px;font-size:14px;padding:9px 0;border-bottom:1px solid var(--line)}
.w.h{font-size:12px;font-weight:600;letter-spacing:.4px;text-transform:uppercase;color:var(--mute);padding-top:16px;border-bottom:0}
.w.i{padding-left:12px}
.w.s,.w.t{font-weight:700}
.w.t{border-bottom:2px solid var(--ink)}
nav.tabs{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:4px;padding:8px 8px calc(14px + env(safe-area-inset-bottom));border-top:1px solid var(--line);background:var(--bg);flex:none}
nav.tabs button{display:flex;flex-direction:column;align-items:center;gap:3px;padding:7px 0;border:0;border-radius:12px;background:transparent;font-size:11px;font-weight:500;color:var(--mute);cursor:pointer}
nav.tabs button.on{background:var(--ink);color:var(--bg);font-weight:700}
.sheet{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:flex-end;z-index:5}
.sheet .scrim{position:absolute;inset:0;border:0;background:var(--scrim);cursor:pointer}
.sheet section{position:relative;background:var(--bg);border-radius:22px 22px 0 0;max-height:88%;display:flex;flex-direction:column;box-shadow:var(--shadow)}
.sheet section .card{--chip:var(--well)}
.grab{display:flex;justify-content:center;padding-top:10px}.grab div{width:64px;height:4px;border-radius:2px;background:var(--line)}
.sheet .shead{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:8px 14px 12px 20px;margin-bottom:12px;border-bottom:1px solid var(--line)}
.sheet .shead .ttl{font-size:20px;font-weight:800;letter-spacing:-.4px;color:var(--ink)}
.sheet .shead .ib{background:var(--chip)}
.sheet .sbody{overflow-y:auto;padding:0 20px calc(22px + env(safe-area-inset-bottom))}
.qbox{display:flex;align-items:center;gap:8px;height:52px;padding:0 4px 0 14px;border:1px solid var(--line);border-radius:12px;background:var(--bg)}
.qbox:focus-within{border-color:var(--ink)}
.qbox input{flex:1;min-width:0;border:0;background:transparent;font:inherit;font-size:16px;color:var(--ink);outline:none}
.tag{font-size:12px;font-weight:700;padding:3px 8px;border-radius:6px}
.tag.ex{background:var(--posbg);color:var(--pos)}.tag.cl{background:var(--amberbg);color:var(--amber)}
.recent{display:flex;flex-wrap:wrap;gap:8px}
.recent button{font-size:14px;font-weight:600;min-height:40px;padding:6px 14px;border:1px solid var(--line);border-radius:10px;background:var(--bg);cursor:pointer}
.center{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;height:100%;color:var(--mute);font-size:14px;text-align:center;padding:24px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
button.card{border:0}
.ms.spin{animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.sbar{display:flex;align-items:center;gap:8px;padding:10px 10px calc(14px + env(safe-area-inset-bottom));border-top:1px solid var(--line);background:var(--bg);flex:none}
.sbar .field{flex:1;min-width:0;position:relative;display:flex;align-items:center;gap:8px;height:52px;padding:0 4px 0 14px;border:1.5px solid var(--ink);border-radius:14px;background:var(--bg)}
.sbar .field.anim{animation:grow .34s cubic-bezier(.2,.8,.2,1);transform-origin:right center}
.sbar input{flex:1;min-width:0;border:0;background:transparent;font:inherit;font-size:16px;color:var(--ink);outline:none}
.sbar input::-webkit-search-cancel-button{display:none}
.sbar .ph{position:absolute;left:46px;right:12px;top:50%;transform:translateY(-50%);color:var(--mute);font-size:16px;pointer-events:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:opacity .3s,transform .3s}
.sbar .ph.out{opacity:0;transform:translateY(-110%)}
.sbar .collapse{background:var(--chip);width:52px;height:52px;border-radius:14px}
@keyframes grow{from{transform:scaleX(.16);opacity:.3}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.sbar .field.anim{animation:none}.sbar .ph{transition:none}}
button.card.rowbtn{border-bottom:0}
</style>
<style>
/* Theme: warm marketplace look. White canvas, one blue accent used sparingly, soft radii, modest weights, hairlines over fills, one shadow tier. */
:root{--bg:#FFFFFF;--card:#FFFFFF;--well:#F7F7F7;--ink:#222222;--mute:#6A6A6A;--line:#EBEBEB;--soft:#DDDDDD;--acc:#4F46E5;--acc2:#4338CA;--pos:#008A05;--posbg:#EBF7EC;--neg:#C13515;--negbg:#FDEDEA;--amber:#B4690E;--amberbg:#FFF5E6;--blue:#222222;--bluebg:#F2F2F2;--scrim:rgba(0,0,0,.5);--lift:0 0 0 1px rgba(0,0,0,.02),0 2px 6px rgba(0,0,0,.04),0 4px 8px rgba(0,0,0,.1);--shadow:var(--lift);--selbg:rgba(79,70,229,.10);--selbd:rgba(79,70,229,.32);--selfg:#4338CA;--bar:rgba(79,70,229,.30)}
html.dark{--bg:#121212;--card:#1A1A1A;--well:#242424;--ink:#F7F7F7;--mute:#A3A3A3;--line:#2A2A2A;--soft:#3A3A3A;--acc:#818CF8;--acc2:#A5B4FC;--pos:#4CC38A;--posbg:#12301F;--neg:#FF6B5E;--negbg:#3A1714;--amber:#F2B04B;--amberbg:#352612;--blue:#F7F7F7;--bluebg:#2A2A2A;--scrim:rgba(0,0,0,.6);--lift:0 0 0 1px rgba(255,255,255,.04),0 4px 12px rgba(0,0,0,.5);--selbg:rgba(129,140,248,.16);--selbd:rgba(129,140,248,.45);--selfg:#A5B4FC;--bar:rgba(129,140,248,.40);color-scheme:dark}
html,body{font-family:Inter,-apple-system,system-ui,Roboto,'Helvetica Neue',sans-serif}
/* Top bar */
header.top{padding:14px 12px 12px 20px;border-bottom:1px solid var(--line)}
.logo{background:var(--acc);border-radius:12px;box-shadow:none;font-weight:700}
h1{font-size:22px;font-weight:600;letter-spacing:-.44px}
.hsub{font-size:13px;color:var(--mute)}
header.top .ib{width:40px;height:40px;border-radius:999px;border:1px solid var(--soft);background:var(--bg);margin-left:6px}
header.top .ib .ms{font-size:20px}
.ib:hover{background:var(--well)}
/* Canvas and cards */
main{padding:20px 16px 32px;gap:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px 20px 18px}
.card:has(.big){box-shadow:var(--lift);border-color:transparent}
.ttl{font-size:16px;font-weight:600;color:var(--ink);gap:10px}
.ttl .ms{font-size:20px;color:var(--ink)}
.card > .ttl:first-child,.card > div:first-child:has(> .ttl){border-bottom:1px solid var(--line)}
.sh,.th,.w.h{font-size:12px;font-weight:600;letter-spacing:.2px;text-transform:none;color:var(--mute)}
.note{color:var(--mute)}
/* Numbers: the one loud moment is net worth */
.big{font-weight:700;letter-spacing:-1.2px}
.stat .l{font-size:13px}
.stat .n{font-size:18px;font-weight:600;letter-spacing:-.2px}
.kv span:nth-child(2){font-weight:600}
.hd{font-size:18px;font-weight:600}
.step{width:26px;height:26px;border-radius:999px;background:var(--selbg);color:var(--selfg);font-weight:700}
/* Pills, badges, chips: fully rounded */
.dp{border-radius:8px;padding:6px 12px;font-weight:600}
.pill{border-radius:6px;padding:4px 10px;font-size:12px;font-weight:600}
.chip{border-radius:6px;background:var(--bluebg);color:var(--ink);font-weight:600;padding:5px 12px}
.tag{border-radius:6px;font-weight:600;padding:3px 9px}
.box{border-radius:12px;font-weight:500}
/* Filter pills instead of segmented controls */
.seg{background:transparent;padding:0;gap:8px;border-radius:0}
.seg button{min-height:36px;padding:0 14px;border:1px solid var(--soft);border-radius:8px;background:var(--bg);color:var(--ink);font-weight:500}
.seg button.on{background:var(--selbg);border-color:var(--selbd);color:var(--selfg);font-weight:600}
.seg[style*="width:168px"]{width:auto !important}
.seg button{padding:0 11px;min-height:34px}
div:has(> .seg) > .ttl{white-space:nowrap}
.mchips button{border-radius:8px;border-color:var(--soft);font-weight:500;min-height:36px}
.mchips button.on{background:var(--selbg);border-color:var(--selbd);color:var(--selfg);font-weight:600}
.sel{border-radius:8px;border-color:var(--soft);background:var(--bg)}
.recent button{border-radius:8px;border-color:var(--soft);font-weight:500}
/* Bars: ink fills; coral only on what needs a look */
.trk{background:var(--line);height:6px}
.fil{background:var(--bar)}
.fil.over{background:var(--neg);opacity:.75}
/* Top bar: the dark mode and privacy toggles, highlighted when on */
header.top .ib.on{background:var(--selbg);border-color:var(--selbd);color:var(--acc)}
button.card{border:1px solid var(--line)}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:46px;border:0;border-radius:10px;background:var(--acc);color:#FFFFFF;font-size:15px;font-weight:600;cursor:pointer}
.btn.sec{background:var(--well);color:var(--ink);border:1px solid var(--line)}
.btn[disabled]{opacity:.5;cursor:default}
.tin{display:block;width:100%;min-height:46px;box-sizing:border-box;border:1px solid var(--soft);border-radius:10px;padding:0 12px;background:var(--bg);color:var(--ink);font:inherit;font-size:15px}
.tin:focus{outline:2px solid var(--acc);outline-offset:1px}
/* Net worth change strip */
.nwd{margin:-6px 0 16px}
.nwd .dp{font-size:13px}
/* Logo: an animated blob in the accent colour */
.logo{width:40px;height:40px;background:none;border-radius:0;box-shadow:none;line-height:0}
.logo svg{width:100%;height:100%;display:block;overflow:visible}
.center .logo{width:88px;height:88px}
.lmsg{min-height:20px;transition:opacity .25s ease}
.lmsg.out{opacity:0}
/* Chart series: distinct from gains green and losses red */
:root{--s2:#7B8BA3;--s3:#E2A03F;--s4:#2E9E95;--s5:#C2649A;--s6:#3FA7D6}
html.dark{--s2:#9AA8BD;--s3:#F0B65E;--s4:#4FC2B8;--s5:#E08BBD;--s6:#6CC4EA}
#tip{position:fixed;z-index:100;display:none;transform:translate(-50%,-100%);background:var(--ink);color:var(--bg);font-size:12px;font-weight:700;padding:6px 10px;border-radius:8px;pointer-events:none;white-space:nowrap;font-variant-numeric:tabular-nums;box-shadow:0 4px 14px rgba(0,0,0,.18)}
.grp{display:flex;justify-content:space-between;align-items:center}
.w.t{border-bottom:2px solid var(--ink)}
/* Bottom navigation: no fill, coral marks where you are */
nav.tabs{border-top:1px solid var(--line);padding-top:6px}
nav.tabs button{border-radius:0;font-size:11px;font-weight:500;color:var(--mute);background:transparent}
nav.tabs button.on{background:transparent;color:var(--acc);font-weight:600}
nav.tabs button.on .ms{font-variation-settings:'wght' 500}
/* Sheets */
.sheet section{border-radius:24px 24px 0 0;box-shadow:var(--lift)}
.sheet .shead .ttl{font-size:20px;font-weight:600;letter-spacing:-.2px}
.sheet .shead .ib{border-radius:999px;background:var(--well)}
.grab div{width:40px;background:var(--soft)}
/* Search: a pill with a coral orb */
.sbar{padding-top:12px}
.sbar .field{height:56px;border:1px solid var(--line);border-radius:12px;box-shadow:var(--lift);padding:0 6px 0 18px}
.sbar .collapse{width:48px;height:48px;border-radius:12px;background:var(--well)}
.qbox{border-radius:12px;border-color:var(--soft)}
.qbox:focus-within{border-color:var(--ink);border-width:2px}
.sbar .field > .ms:first-child{order:9;flex:none;width:40px;height:40px;border-radius:8px;background:var(--acc);color:#FFFFFF;display:inline-flex;align-items:center;justify-content:center;font-size:20px}
.sbar .ph{left:18px;right:56px}
</style>
</head>
<body>

<script>
(function () {
'use strict';
/* ---------- State ---------- */
var D = null, S = { tab: 'home', page: null, hid: null, sheet: null, taxFy: 0, payFy: 0, payMode: 'm', payMonth: null, alloc: 'fn', openType: null, loanView: 'now', spendView: 'm', nwRange: 'w', q: '', searchOpen: false, phI: 0 };
var LS = { get: function (k, d) { try { var v = localStorage.getItem('vault_' + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set: function (k, v) { try { localStorage.setItem('vault_' + k, JSON.stringify(v)); } catch (e) {} } };
var mask = LS.get('mask', false), theme = LS.get('theme', null);

/* ---------- Formatting ---------- */
var MONS = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
var FYM = ['Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec', 'Jan', 'Feb', 'Mar'];
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
function grp(n) { var s = String(Math.round(Math.abs(n))), l = s.slice(-3), r = s.slice(0, -3); return (r ? r.replace(/\B(?=(\d{2})+(?!\d))/g, ',') + ',' : '') + l; }
// Masking: on Home, amounts above ₹25 L; on every other page, amounts of ₹1 Cr or more.
function onHome() { return S.tab === 'home' && !S.page && !S.searchOpen; }
function hidden(n) { return mask && (onHome() ? Math.abs(n) > 25e5 : Math.abs(n) >= 1e7); }
var DOTS = '₹ ••••••';
function inr(n, sign) { if (n == null || isNaN(n)) return '—'; if (hidden(n)) return DOTS; return (n < 0 ? '−' : sign && n > 0 ? '+' : '') + '₹' + grp(n); }
function inrC(n, sign) { if (n == null || isNaN(n)) return '—'; if (hidden(n)) return DOTS; var a = Math.abs(n), s = n < 0 ? '−' : sign && n > 0 ? '+' : ''; return a >= 1e7 ? s + '₹' + (a / 1e7).toFixed(2) + ' Cr' : a >= 1e5 ? s + '₹' + (a / 1e5).toFixed(2) + ' L' : s + '₹' + grp(a); }
// Tooltips: the short form, in crore, lakh or thousand (₹1.23 Cr, ₹4.56 L, ₹21.32 K); under ₹1,000 in full
function inrK(n) { if (n == null || isNaN(n)) return '—'; if (hidden(n)) return DOTS; var a = Math.abs(n), s = n < 0 ? '−' : ''; return a >= 1e7 ? s + '₹' + (a / 1e7).toFixed(2) + ' Cr' : a >= 1e5 ? s + '₹' + (a / 1e5).toFixed(2) + ' L' : a >= 1e3 ? s + '₹' + (a / 1e3).toFixed(2) + ' K' : s + '₹' + grp(a); }
function pct(p, d, sign) { if (p == null || isNaN(p)) return '—'; return (p < 0 ? '−' : sign && p > 0 ? '+' : '') + Math.abs(p * 100).toFixed(d == null ? 1 : d) + '%'; }
function inrRange(lo, hi) {
  if (hidden(lo) || hidden(hi)) return DOTS;
  var u = Math.max(Math.abs(lo), Math.abs(hi)) >= 1e7 ? [1e7, ' Cr'] : Math.max(Math.abs(lo), Math.abs(hi)) >= 1e5 ? [1e5, ' L'] : null;
  return u ? '₹' + (lo / u[0]).toFixed(2) + '–' + (hi / u[0]).toFixed(2) + u[1] : inr(lo) + '–' + grp(hi);
}
function xirr(p) { if (p == null || isNaN(p)) return '—'; var t = Math.trunc(p * 10000) / 100; return (t < 0 ? '−' : '') + Math.abs(t).toFixed(2) + '%'; }
function cls(n) { return n > 0 ? 'pos' : n < 0 ? 'neg' : ''; }
function day(k) { if (!k) return '—'; var p = k.split('-'); return Number(p[2]) + ' ' + MONS[Number(p[1]) - 1] + ' ' + p[0]; }
function dayShort(k) { if (!k) return ''; var p = k.split('-'); return Number(p[2]) + ' ' + MONS[Number(p[1]) - 1]; }
function monYr(k) { var p = k.split('-'); return MONS[Number(p[1]) - 1] + ' ' + p[0]; }
function M(v) { return v; }
function sum(a) { return a.reduce(function (s, x) { return s + (Number(x) || 0); }, 0); }
function daysTo(k) { var t = new Date(D.today + 'T00:00:00'), d = new Date(k + 'T00:00:00'); return Math.round((d - t) / 864e5); }

/* ---------- Logo ---------- */
var BLOB = '<svg class="blob" viewBox="-60 -60 1144 1033" aria-hidden="true" focusable="false"><g filter="url(#goo)" style="fill:var(--acc)"><path d="M70 370C70 280 140 255 240 245C330 235 400 200 480 135C560 70 650 0 760 0C880 0 980 100 980 225C980 330 920 410 830 437C700 487 605 560 605 700C605 830 560 913 465 913C350 913 300 820 290 690C280 580 220 545 150 503C100 470 70 440 70 370Z"><animate attributeName="d" dur="4.8s" repeatCount="indefinite" calcMode="spline" keyTimes="0;0.33;0.66;1" keySplines="0.45 0 0.55 1;0.45 0 0.55 1;0.45 0 0.55 1" values="M70 370C70 280 140 255 240 245C330 235 400 200 480 135C560 70 650 0 760 0C880 0 980 100 980 225C980 330 920 410 830 437C700 487 605 560 605 700C605 830 560 913 465 913C350 913 300 820 290 690C280 580 220 545 150 503C100 470 70 440 70 370Z;M62 370C82 280 158 244 259 223C351 209 427 176 513 118C593 64 677 7 787 21C907 26 1014 121 1003 246C981 351 904 435 809 462C671 501 571 560 583 700C610 830 582 907 487 894C372 887 303 795 266 665C246 555 187 525 120 491C74 465 48 440 62 370Z;M98 346C99 256 167 240 267 247C356 252 421 226 491 165C558 98 635 18 745 0C865 -19 984 71 1005 196C1010 301 944 386 851 425C713 497 603 584 580 724C576 854 540 941 445 943C330 933 271 833 266 701C275 589 221 544 160 490C116 450 90 416 98 346Z;M70 370C70 280 140 255 240 245C330 235 400 200 480 135C560 70 650 0 760 0C880 0 980 100 980 225C980 330 920 410 830 437C700 487 605 560 605 700C605 830 560 913 465 913C350 913 300 820 290 690C280 580 220 545 150 503C100 470 70 440 70 370Z"/></path><circle cx="863" cy="698" r="131"><animate attributeName="cx" dur="4.8s" repeatCount="indefinite" calcMode="spline" keyTimes="0;0.33;0.66;1" keySplines="0.45 0 0.55 1;0.45 0 0.55 1;0.45 0 0.55 1" values="863;760;835;863"/><animate attributeName="cy" dur="4.8s" repeatCount="indefinite" calcMode="spline" keyTimes="0;0.33;0.66;1" keySplines="0.45 0 0.55 1;0.45 0 0.55 1;0.45 0 0.55 1" values="698;640;730;698"/><animate attributeName="r" dur="4.8s" repeatCount="indefinite" calcMode="spline" keyTimes="0;0.33;0.66;1" keySplines="0.45 0 0.55 1;0.45 0 0.55 1;0.45 0 0.55 1" values="131;118;140;131"/></circle></g></svg>';
// Keep the blob's motion continuous across re-renders
function syncBlobs() {
  var t = (performance.now() / 1000) % 4.8;
  document.querySelectorAll('svg.blob').forEach(function (b) { try { b.setCurrentTime(t); } catch (e) {} });
}
// Loading: a few lines that cycle until the sheet is read
var LMSG = ['Reading your sheet', 'Totting up every account', 'Fetching today\'s prices', 'Working out your tax', 'Looking for leaks', 'Lining up your net worth'], li = 0;
var lt = setInterval(function () {
  var e = document.querySelector('.lmsg'); if (!e || D) { clearInterval(lt); return; }
  e.classList.add('out'); setTimeout(function () { li = (li + 1) % LMSG.length; e.textContent = LMSG[li]; e.classList.remove('out'); }, 250);
}, 1800);
syncBlobs();

/* ---------- Data ---------- */
function load(refresh) {
  var ok = function (json) { var first = !D; D = JSON.parse(json); S._sugg = null; if (first) { S.taxFy = 0; S.payFy = 0; S.payMonth = null; } render(); };
  var fail = function (e) { document.getElementById('app').innerHTML = '<div class="center"><div class="logo">' + BLOB + '</div>Couldn\'t read the sheet.<br>' + esc(e && e.message || e) + '<button class="recent" data-act="reload" style="border:1px solid var(--line);border-radius:3px;padding:8px 14px;background:var(--card);cursor:pointer;font-weight:700">Try again</button></div>'; };
  if (window.google && google.script && google.script.run) google.script.run.withSuccessHandler(ok).withFailureHandler(fail).getAppData(!!refresh);
  else fetch('data.json').then(function (r) { return r.text(); }).then(ok).catch(fail);
}

/* ---------- Pieces ---------- */
// One accent, blue, in a light and a dark shade. The deep shade is for selected text; the tints are for selected fills, borders and bars.
var ACC = { light: ['#1F5BD8', '#1849B0'], dark: ['#8AB4FF', '#B3CEFF'] };
function rgb(h) { return [1, 3, 5].map(function (i) { return parseInt(h.slice(i, i + 2), 16); }).join(','); }
// Light or dark: follows the phone until the toggle is tapped, then remembers the choice
function applyTheme() {
  var dark = theme ? theme === 'dark' : !!(window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches), a = ACC[dark ? 'dark' : 'light'], st = document.documentElement.style;
  document.documentElement.classList.toggle('dark', dark);
  st.setProperty('--acc', a[0]); st.setProperty('--acc2', a[1]); st.setProperty('--selfg', a[1]);
  st.setProperty('--selbg', 'rgba(' + rgb(a[0]) + ',' + (dark ? .16 : .10) + ')'); st.setProperty('--selbd', 'rgba(' + rgb(a[0]) + ',' + (dark ? .45 : .32) + ')'); st.setProperty('--bar', 'rgba(' + rgb(a[0]) + ',' + (dark ? .40 : .30) + ')');
  return dark;
}
applyTheme();
if (window.matchMedia) try { matchMedia('(prefers-color-scheme: dark)').addEventListener('change', function () { if (!theme) { applyTheme(); render(); } }); } catch (e) {}
// Top bar: dark mode, then hiding large amounts
function themeToggle() { var dark = document.documentElement.classList.contains('dark'), t = dark ? 'Switch to light mode' : 'Switch to dark mode'; return '<button type="button" class="ib' + (dark ? ' on' : '') + '" aria-pressed="' + dark + '" aria-label="' + t + '" title="' + t + '" data-act="theme"><span class="ms">' + (dark ? 'light_mode' : 'dark_mode') + '</span></button>'; }
function privacyBtn() { var t = mask ? 'Show large amounts' : 'Hide large amounts'; return '<button type="button" class="ib' + (mask ? ' on' : '') + '" aria-pressed="' + mask + '" aria-label="' + t + '" title="' + t + '" data-act="mask"><span class="ms">' + (mask ? 'visibility_off' : 'visibility') + '</span></button>'; }
function header(title, sub, opts) {
  opts = opts || {};
  if (opts.back) return '<header class="top back"><div class="hl"><button type="button" class="ib" aria-label="Back" data-act="back"><span class="ms">arrow_back</span></button><div class="rl"><h1>' + esc(title) + '</h1>' + (sub ? '<span class="hsub">' + esc(sub) + '</span>' : '') + '</div></div>' + '<div style="display:flex;align-items:center">' + themeToggle() + privacyBtn() + '</div></header>';
  return '<header class="top"><div class="hl">' + (opts.logo !== false ? '<div class="logo" aria-hidden="true">' + BLOB + '</div>' : '') + '<div class="rl"><h1>' + esc(title) + '</h1>' + (sub ? '<span class="hsub">' + esc(sub) + '</span>' : '') + '</div></div>' + '<div style="display:flex;align-items:center">' + themeToggle() + privacyBtn() + '</div></header>';
}
function nav() {
  var T = [['home', 'home', 'Home'], ['income', 'payments', 'Income'], ['spend', 'shopping_bag', 'Spend'], ['invest', 'trending_up', 'Invest'], ['check', 'fact_check', 'Check'], ['search', 'search', 'Search']];
  var cur = S.page === 'payslips' || S.page === 'source' ? 'income' : S.page === 'loan' ? 'spend' : S.page === 'locker' || S.page === 'premiums' ? 'check' : S.page === 'holding' ? (S.tab === 'home' || S.tab === 'check' || S.tab === 'search' ? S.tab : 'invest') : S.tab;
  return '<nav class="tabs" aria-label="Primary">' + T.map(function (t) { return '<button type="button" class="' + (cur === t[0] ? 'on' : '') + '"' + (cur === t[0] ? ' aria-current="page"' : '') + ' data-act="tab" data-v="' + t[0] + '"><span class="ms">' + t[1] + '</span>' + t[2] + '</button>'; }).join('') + '</nav>';
}
function stat(l, n, s, ncls) { return '<div class="stat"><span class="l">' + esc(l) + '</span><span class="n ' + (ncls || '') + '">' + n + '</span>' + (s != null ? '<span class="s">' + s + '</span>' : '') + '</div>'; }
function bars(values, opts) {
  opts = opts || {};
  var mx = Math.max.apply(null, values.map(function (v) { return Math.abs(v || 0); }).concat([1])), h = opts.h || 56, n = values.length;
  var out = '<div class="bars" style="grid-template-columns:repeat(' + n + ',minmax(0,1fr));height:' + (h + 18) + 'px" role="img" aria-label="' + esc(opts.label || 'Bar chart') + '">';
  values.forEach(function (v, i) {
    var est = opts.est && opts.est(i), hi = opts.hi == null || opts.hi === i;
    var bg = est ? 'background:var(--proj);border:1px dashed var(--projb)' : 'background:' + (hi ? 'var(--acc)' : 'var(--soft)');
    var tip = (opts.labels ? opts.labels[i] + ': ' : '') + inrK(v || 0) + (est ? ' (estimate)' : '');
    out += '<div data-tip="' + esc(tip) + '" style="height:' + h + 'px;display:flex;align-items:flex-end;cursor:default"><div style="width:100%;height:' + Math.max(2, Math.round(Math.abs(v || 0) / mx * h)) + 'px;' + bg + '"></div></div>';
  });
  out += '</div>';
  if (opts.labels) out += '<div class="blab" style="grid-template-columns:repeat(' + n + ',minmax(0,1fr))">' + opts.labels.map(function (l) { return '<span>' + esc(l) + '</span>'; }).join('') + '</div>';
  return out;
}

/* ---------- Home ---------- */
// Small symbol badges for the markets table: currency signs, and Au / Ag for gold and silver
function mktBadge(label) {
  var t = /^usd/i.test(label) ? ['$', 'var(--bluebg)', 'var(--blue)'] : /^eur/i.test(label) ? ['€', 'var(--bluebg)', 'var(--blue)'] : /^gbp/i.test(label) ? ['£', 'var(--bluebg)', 'var(--blue)'] :
    /^gold/i.test(label) ? ['Au', '#F6E7B0', '#7A5A00'] : /^silver/i.test(label) ? ['Ag', '#E3E7EE', '#4A5568'] : /nifty|nasdaq/i.test(label) ? ['↗', 'var(--posbg)', 'var(--pos)'] : /inflation/i.test(label) ? ['%', 'var(--amberbg)', 'var(--amber)'] : /repo/i.test(label) ? ['₹', 'var(--amberbg)', 'var(--amber)'] : null;
  return t ? '<span aria-hidden="true" style="flex:none;width:26px;height:26px;border-radius:7px;display:inline-flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;background:' + t[1] + ';color:' + t[2] + '">' + t[0] + '</span>' : '';
}
function vHome() {
  var H = D.home, now = new Date(D.at);
  var dateStr = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'][now.getDay()] + ' ' + now.getDate() + ' ' + MONS[now.getMonth()];
  var o = header('Vault', 'A ledger in a letter · demo with made-up data', { logo: true }) + '<main>';
  if (H.emiAlert) {
    var A = H.emiAlert;
    o += '<div class="box ' + (A.critical ? 'r' : 'a') + '" style="margin:0">' + (A.critical ? 'EMI at risk' : 'EMI account below ' + inrC(A.min)) + ': ' + esc(A.bank) + ' holds ' + inrC(A.bal) + ' against the ' + inrC(A.emi) + ' EMI due ' + day(A.due) + '. Top up ' + inrC(A.min - A.bal) + '.</div>';
  }
  o += '<section class="card"><h2 class="ttl">Net worth · ' + dateStr + '</h2>';
  o += '<div class="big" style="font-size:40px;line-height:1.1;margin:0 0 14px">' + M(inrC(H.nw)) + '</div>';
  // Change since yesterday's midnight log; the trend card below covers 7 days, 30 days and 12 months
  var d1 = H.deltas.find(function (x) { return /since/i.test(x.l); });
  if (d1) o += '<div class="nwd"><span class="dp num ' + (d1.d >= 0 ? 'up' : 'dn') + '">' + (d1.d > 0 ? '▲ ' : d1.d < 0 ? '▼ ' : '') + inrC(Math.abs(d1.d)) + ' (' + pct(d1.base ? Math.abs(d1.d / d1.base) : 0, 2) + ') <i>since yesterday</i></span></div>';
  var ap = H.nw ? H.assets / H.nw : null, lp = H.nw ? H.liab / H.nw : null;
  o += '<div class="stats" style="grid-template-columns:repeat(2,minmax(0,1fr));padding-top:12px;border-top:1px solid var(--line)">' + stat('Assets', M(inrC(H.assets)) + ' <span style="font-size:14px;font-weight:500;color:var(--mute)">' + pct(ap) + '</span>') + stat('Liabilities', M(inrC(H.liab)) + ' <span style="font-size:14px;font-weight:500;color:var(--mute)">' + pct(lp) + '</span>') + '</div></section>';
  // Net worth trend: one value a day from the midnight log, or the value at each month end
  var SR = H.series || [], R = S.nwRange || 'w', byK = {}; SR.forEach(function (x) { byK[x.k] = x.nw; });
  var seg = '<div class="seg" role="group" aria-label="Period" style="width:168px">' + [['w', '7D'], ['m', '30D'], ['y', '12M']].map(function (x) { return '<button type="button" class="' + (R === x[0] ? 'on' : '') + '" aria-pressed="' + (R === x[0]) + '" data-act="nwrange" data-v="' + x[0] + '">' + x[1] + '</button>'; }).join('') + '</div>';
  o += '<section class="card"><div style="display:flex;justify-content:space-between;align-items:center;gap:10px;padding-bottom:10px"><h2 class="ttl">Net worth trend</h2>' + seg + '</div>';
  var keys = [], labels = [], vals = [];
  if (R === 'y') {
    var ends = {}; SR.forEach(function (x) { ends[x.k.slice(0, 7)] = x; });
    var t0 = new Date(D.today + 'T12:00:00');
    for (var i = 11; i >= 0; i--) { var dt = new Date(t0.getFullYear(), t0.getMonth() - i, 1), mk = dt.getFullYear() + '-' + ('0' + (dt.getMonth() + 1)).slice(-2), e = ends[mk]; keys.push(e ? e.k : null); labels.push(MONS[dt.getMonth()]); vals.push(e ? e.nw : null); }
  } else {
    var N = R === 'm' ? 30 : 7, t1 = new Date(D.today + 'T12:00:00').getTime();
    for (var j = N - 1; j >= 0; j--) { var d0 = new Date(t1 - j * 864e5), k = d0.getFullYear() + '-' + ('0' + (d0.getMonth() + 1)).slice(-2) + '-' + ('0' + d0.getDate()).slice(-2); keys.push(k); vals.push(byK[k] != null ? byK[k] : null); labels.push(N === 7 || j % 7 === 0 ? dayShort(k) : ''); }
  }
  var have = vals.map(function (v, i) { return v == null ? null : { k: keys[i], v: v }; }).filter(Boolean);
  if (have.length > 1) {
    var f = have[0], l = have[have.length - 1], ch = l.v - f.v;
    o += lineChart(labels, [{ name: 'Net worth', color: 'var(--acc)', values: vals }], { label: 'Net worth ' + (R === 'y' ? 'at each month end, last 12 months' : 'each day, last ' + (R === 'm' ? 30 : 7) + ' days'), dots: R === 'w' });
    o += '<div class="stats" style="margin-top:12px;padding-top:12px;border-top:1px solid var(--line);grid-template-columns:repeat(2,minmax(0,1fr))">' + stat('Change', inrC(ch, true), f.v ? '<span class="' + cls(ch) + '">' + pct(ch / Math.abs(f.v), 2, true) + '</span> since ' + (R === 'y' ? monYr(f.k) : dayShort(f.k)) : '', cls(ch)) +
      stat(R === 'y' ? 'Highest month end' : 'Highest', M(inrC(Math.max.apply(null, have.map(function (x) { return x.v; })))), null) + '</div>';
    o += '<p class="note">' + (R === 'y' ? 'Each point is net worth at the last log of the month; this month is today\'s value.' : 'Each point is net worth logged at midnight; today is the live value.') + '</p>';
  } else o += '<p class="note" style="margin:0">Fills in from the midnight log. Two ' + (R === 'y' ? 'month ends' : 'days') + ' are needed for a line.</p>';
  o += '</section>';

function lev(a, b) { var m = a.length, n = b.length, prev = [], j, i; if (!m) return n; if (!n) return m; for (j = 0; j <= n; j++) prev[j] = j; for (i = 1; i <= m; i++) { var cur = [i]; for (j = 1; j <= n; j++) cur[j] = Math.min(prev[j] + 1, cur[j - 1] + 1, prev[j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1)); prev = cur; } return prev[n]; }

function vSearch() {

    var tol = q.length <= 4 ? 1 : 2, best = 99;
